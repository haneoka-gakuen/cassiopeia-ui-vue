name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: haneoka-gakuen/cassiopeia
          path: .deps/cassiopeia
      - uses: actions/checkout@v7
        with:
          repository: haneoka-gakuen/cassiopeia-plugin-our-notes
          path: .deps/our-notes
      - uses: actions/checkout@v7
        with:
          repository: haneoka-gakuen/cassiopeia-renderer-three
          path: .deps/renderer-three
      - uses: actions/checkout@v7
        with:
          repository: haneoka-gakuen/cassiopeia-host-web
          path: .deps/host-web
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @haneoka/cassiopeia build:web
      - run: pnpm --filter @haneoka/cassiopeia-plugin-our-notes build
      - run: pnpm --filter @haneoka/cassiopeia-renderer-three build
      - run: pnpm --filter @haneoka/cassiopeia-host-web build
      - run: pnpm check
      - run: npm pack --dry-run --ignore-scripts
